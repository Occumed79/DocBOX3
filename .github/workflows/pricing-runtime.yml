name: Pricing runtime matrix

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed Price Intelligence base URL, e.g. https://service.onrender.com'
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run deployed self-pay source matrix
        env:
          PRICE_INTELLIGENCE_BASE_URL: ${{ inputs.base_url }}
        run: npm run verify:runtime

      - name: Upload runtime matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-runtime-matrix
          path: runtime-source-matrix.json
          if-no-files-found: ignore
