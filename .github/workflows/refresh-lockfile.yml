name: Refresh dependency lockfile

on:
  push:
    branches:
      - feature/self-pay-price-intelligence
    paths:
      - 'package.json'
      - '.github/workflows/refresh-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/self-pay-price-intelligence

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --legacy-peer-deps

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh npm dependency lockfile'
          git push origin HEAD:feature/self-pay-price-intelligence
