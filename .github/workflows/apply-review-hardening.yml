name: Apply review hardening

on:
  push:
    branches:
      - feature/self-pay-price-intelligence
    paths:
      - '.github/workflows/apply-review-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: feature/self-pay-price-intelligence
          persist-credentials: false

      - name: Apply verified review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, count))

          def replace_between(path, start_marker, end_marker, replacement):
              text = read(path)
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Marker not found in {path}: {start_marker!r} -> {end_marker!r}')
              write(path, text[:start] + replacement + text[end:])

          # GitHub Actions: do not persist GITHUB_TOKEN into local git config for jobs
          # that execute repository-controlled npm/application code.
          for path in [
              '.github/workflows/ci.yml',
              '.github/workflows/pricing-runtime.yml',
              '.github/workflows/public-source-smoke.yml',
          ]:
              replace(
                  path,
                  '      - name: Check out repository\n        uses: actions/checkout@v4\n',
                  '      - name: Check out repository\n        uses: actions/checkout@v4\n        with:\n          persist-credentials: false\n',
              )

          replace(
              '.github/workflows/ci.yml',
              '      - name: Install dependencies\n        run: npm install --legacy-peer-deps\n',
              '      - name: Install dependencies from lockfile\n        run: npm ci --legacy-peer-deps\n',
          )
          replace(
              '.github/workflows/pricing-runtime.yml',
              '      - name: Install dependencies\n        run: npm install --legacy-peer-deps\n',
              '      - name: Install dependencies from lockfile\n        run: npm ci --legacy-peer-deps\n\n      - name: Audit production dependencies\n        run: npm audit --omit=dev --audit-level=high\n',
          )

          # Restore landing metadata at the root and scope Price Intelligence metadata
          # to /vault only.
          replace(
              'app/layout.tsx',
              "export const metadata: Metadata = {\n  title: 'Price Intelligence | Occu-Med',\n  description: 'Self-pay healthcare price intelligence, geographic market exploration, quote comparison, and evidence-based pricing reports.',\n};\n\nexport const viewport: Viewport = {\n  width: 'device-width',\n  initialScale: 1,\n  viewportFit: 'cover',\n  themeColor: '#e9f1f8',\n  colorScheme: 'light',\n};",
              "export const metadata: Metadata = {\n  title: 'DocBox | Occu-Med',\n  description: 'Occu-Med DocBox — a luminous visual workspace for storing, previewing, organizing, and securely sharing documents.',\n};\n\nexport const viewport: Viewport = {\n  width: 'device-width',\n  initialScale: 1,\n  viewportFit: 'cover',\n  themeColor: '#415881',\n  colorScheme: 'dark',\n};",
          )
          write('app/vault/layout.tsx', """import type { Metadata, Viewport } from 'next';

