name: Apply review hardening

on:
  push:
    branches:
      - feature/self-pay-price-intelligence
    paths:
      - '.github/workflows/apply-review-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: feature/self-pay-price-intelligence
          persist-credentials: false

      - name: Apply verified review fixes
        run: python .github/scripts/apply_review_hardening.py

      - name: Keep workflow edits for connector-managed commits
        run: git checkout HEAD -- .github/workflows/ci.yml .github/workflows/pricing-runtime.yml .github/workflows/public-source-smoke.yml

      - name: Commit hardening changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No hardening changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Address pricing review hardening findings'
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:feature/self-pay-price-intelligence
