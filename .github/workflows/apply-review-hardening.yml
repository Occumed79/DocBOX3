              'lib/pricing/location.ts',
              "  const lower = location.toLowerCase();\n  for (const [name, code] of Object.entries(STATE_CODES)) {\n    if (new RegExp(`\\\\b${name.replace(' ', '\\\\s+')}\\\\b`, 'i').test(lower)) return code;\n  }",
              "  for (const [pattern, code] of STATE_NAME_ENTRIES) {\n    if (pattern.test(location)) return code;\n  }",
          )

          # Verification must prove the DB CHECK is the exact six-value allowlist.
          replace(
              'scripts/verify-pricing-integrity.mjs',
              "for (const basis of allowed) {\n  assert.match(registry, new RegExp(`['\\\"]${basis}['\\\"]`), `registry must include ${basis}`);\n  assert.match(schema, new RegExp(`['\\\"]${basis}['\\\"]`), `database CHECK must include ${basis}`);\n}\n\nconst checkBody = schema.match(/payment_basis\\s+TEXT\\s+NOT\\s+NULL\\s+CHECK\\s*\\(payment_basis\\s+IN\\s*\\(([\\s\\S]*?)\\)\\)/i)?.[1] || '';\nassert.ok(checkBody, 'pi_price_observations payment-basis CHECK constraint must exist');\nfor (const basis of forbidden) {\n  assert.doesNotMatch(checkBody, new RegExp(`['\\\"]${basis}['\\\"]`, 'i'), `database must reject ${basis}`);\n}",
              "for (const basis of allowed) {\n  assert.match(registry, new RegExp(`['\\\"]${basis}['\\\"]`), `registry must include ${basis}`);\n}\n\nconst checkBody = schema.match(/payment_basis\\s+TEXT\\s+NOT\\s+NULL\\s+CHECK\\s*\\(payment_basis\\s+IN\\s*\\(([\\s\\S]*?)\\)\\)/i)?.[1] || '';\nassert.ok(checkBody, 'pi_price_observations payment-basis CHECK constraint must exist');\nconst admittedBases = [...checkBody.matchAll(/'([^']+)'/g)].map((match) => match[1]).sort();\nassert.deepEqual(admittedBases, [...allowed].sort(), 'database CHECK must admit exactly the six approved payment bases');\nfor (const basis of forbidden) {\n  assert.doesNotMatch(checkBody, new RegExp(`['\\\"]${basis}['\\\"]`, 'i'), `database must reject ${basis}`);\n}",
          )

          verify = read('scripts/verify-pricing-integrity.mjs')
          insert_after = "const mapEnrichment = read('lib/pricing/map-enrichment.ts');\n"
          if insert_after not in verify:
              raise SystemExit('verify script read marker missing')
          verify = verify.replace(insert_after, insert_after + """const licensedFeed = read('lib/pricing/adapters/licensed-cash-feed.ts');
const loa = read('lib/pricing/adapters/loa.ts');
const openSources = read('lib/pricing/adapters/occumed-open-sources.ts');
const location = read('lib/pricing/location.ts');
const geocode = read('lib/pricing/geocode.ts');
const ranking = read('lib/pricing/evidence-ranking.ts');
""", 1)
          insert_before = "assert.doesNotMatch(render, /CLEARHEALTHCOSTS_API_/i"
          idx = verify.find(insert_before)
          if idx < 0:
              raise SystemExit('verify script assertion insertion marker missing')
          extra = """assert.match(licensedFeed, /currentProcedureMatch === true/, 'licensed feeds must require identified matching procedure context');
assert.match(licensedFeed, /depth > 8/, 'licensed feed traversal must be depth bounded');
assert.match(licensedFeed, /target\\.protocol !== ['\"]https:['\"]/, 'licensed feed endpoints must require HTTPS');
assert.match(licensedFeed, /redirect:\\s*['\"]manual['\"]/, 'licensed feeds must disable automatic redirects');
assert.match(loa, /effectiveCode\\?\\.toUpperCase\\(\\) === procedureCode\\.toUpperCase\\(\\)/, 'Loa rows must have a matching effective procedure code');
assert.doesNotMatch(openSources, /JSON\\.stringify\\(item\\)\\.toUpperCase\\(\\)/, 'TestWell must not match procedure codes via arbitrary JSON text');
assert.match(openSources, /const modalityToken = norm\\(modality\\)/, 'Expected Health must normalize modality tokens');
assert.match(openSources, /HOSPITAL_LEDGER_TTL_MS/, 'Hospital Ledger cache must expire');
assert.match(location, /sort\\(\\(a, b\\) => b\\[0\\]\\.length - a\\[0\\]\\.length\\)/, 'state names must match longest first');
assert.match(geocode, /\\^\\[A-Z\\]\\{2\\}\\$/, 'geocoded state must remain a two-letter code');
assert.match(ranking, /AI_RANKING_BUDGET_MS = 8_000/, 'AI evidence ranking must have one bounded advisory budget');
assert.match(turquoise, /TURQUOISE_REQUEST_BUDGET_MS = 12_000/, 'Turquoise requests must share a bounded search budget');

"""
          verify = verify[:idx] + extra + verify[idx:]
          write('scripts/verify-pricing-integrity.mjs', verify)
          PY

      - name: Commit hardening changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No hardening changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Address pricing review hardening findings'
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:feature/self-pay-price-intelligence
