services:
  - type: web
    name: source-vault
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && node scripts/migrate.js && npm run build
    startCommand: node_modules/.bin/next start -p $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_MAPTILER_KEY
        sync: false

      # ClearHealthCosts permitted API/feed. URL may contain placeholders:
      # {code} {procedure} {location} {lat} {lon} {radius}
      - key: CLEARHEALTHCOSTS_API_URL
        sync: false
      - key: CLEARHEALTHCOSTS_API_KEY
        sync: false
      - key: CLEARHEALTHCOSTS_API_KEY_HEADER
        sync: false
      - key: CLEARHEALTHCOSTS_API_METHOD
        value: GET

      # Turquoise Consumer Pricing API OAuth 2.0 client credentials.
      # The backend mints/caches short-lived bearer tokens and requests cash pricing only.
      - key: TURQUOISE_ORGANIZATION_ID
        sync: false
      - key: TURQUOISE_CLIENT_ID
        sync: false
      - key: TURQUOISE_CLIENT_SECRET
        sync: false

      # FAIR Health: only a licensed endpoint whose returned field is explicitly
      # cash/self-pay. Out-of-network charges and claims/allowed benchmarks are excluded.
      - key: FAIR_HEALTH_CASH_FEED_URL
        sync: false
      - key: FAIR_HEALTH_CASH_FEED_TOKEN
        sync: false
      - key: FAIR_HEALTH_CASH_FEED_TOKEN_HEADER
        sync: false
      - key: FAIR_HEALTH_CASH_FEED_METHOD
        value: GET

      # Advisory evidence ranking only. These server-side keys never affect price math.
      # Secondary keys are used only as failover for auth/rate-limit failures.
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY_2
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_API_KEY_2
        sync: false
      - key: COHERE_API_KEY_3
        sync: false
      - key: COHERE_API_KEY_4
        sync: false

      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_REGION
        sync: false
